# Supabase pauses free projects after a period of inactivity. This calls the
# read-only ping() function every 3 days so the database stays active.
# Requires repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: Keep Supabase alive
on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
